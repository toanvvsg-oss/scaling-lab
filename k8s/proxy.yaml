apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-config
  namespace: scaling-lab
data:
  default.conf: |
    upstream app_backend {
      server app.scaling-lab.svc.cluster.local:3000;
      keepalive 32;
    }
    server {
      listen 8080;
      location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $request_id;
        proxy_pass http://app_backend;
        proxy_buffering off;
        proxy_read_timeout 35s;
        add_header X-Edge-Connection $connection always;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: scaling-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaling-edge
  template:
    metadata:
      labels:
        app: scaling-edge
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
      volumes:
        - name: config
          configMap:
            name: edge-config
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: scaling-lab
spec:
  type: NodePort
  selector:
    app: scaling-edge
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
