apiVersion: v1
kind: Namespace
metadata:
  name: scaling-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: scaling-lab
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: scaling-app
  template:
    metadata:
      labels:
        app: scaling-app
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: scaling-lab-app:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: SHUTDOWN_MODE
              value: graceful
            - name: SHUTDOWN_MS
              value: "24000"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 2"]
          startupProbe:
            httpGet:
              path: /health/live
              port: 3000
            periodSeconds: 1
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: scaling-lab
spec:
  selector:
    app: scaling-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
