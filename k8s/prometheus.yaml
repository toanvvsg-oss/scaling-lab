apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: scaling-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-discovery
  namespace: scaling-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-discovery
  namespace: scaling-lab
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: scaling-lab
roleRef:
  kind: Role
  name: prometheus-pod-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-discovery
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: scaling-lab
roleRef:
  kind: ClusterRole
  name: prometheus-discovery
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: scaling-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: scaling-app
        metrics_path: /metrics
        # No namespaces.names allowlist: that field is exact-name only and
        # cannot wildcard scaling-run-*. Discover pods in all namespaces and
        # keep only the legacy lab namespace plus run namespaces below.
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: scaling-lab|scaling-run-[a-z0-9]+
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: scaling-app
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:3000
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_labrun]
            target_label: labrun
      - job_name: kube-state-metrics
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names: [scaling-lab]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            action: keep
            regex: kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: scaling-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaling-prometheus
  template:
    metadata:
      labels:
        app: scaling-prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2h
            - --web.listen-address=0.0.0.0:9090
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: scaling-lab
spec:
  selector:
    app: scaling-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
