apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: scaling-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scaling-lab-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scaling-lab-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: scaling-lab
roleRef:
  kind: ClusterRole
  name: scaling-lab-kube-state-metrics
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: scaling-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.12.0
          args: ["--resources=pods,deployments,horizontalpodautoscalers"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: scaling-lab
  labels:
    app: kube-state-metrics
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: scaling-lab
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: scaling-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.scaling-lab.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 5s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: scaling-lab
data:
  scaling-lab.json: |
    {
      "uid": "scaling-lab",
      "title": "Scaling Lab \u00b7 HTTP and pod lifecycle",
      "tags": [
        "scaling-lab"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "run",
            "label": "Experiment run",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "scaling-prometheus"
            },
            "query": "label_values(scaling_lab_http_requests_total{labrun!=\"\"}, labrun)",
            "includeAll": true,
            "allValue": ".*",
            "multi": false,
            "refresh": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 5,
          "type": "text",
          "title": "How to read this experiment",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 4
          },
          "options": {
            "mode": "markdown",
            "content": "Select one **run** to isolate its traffic and pods. Prometheus scrapes every **5 seconds**; rate panels use `$__rate_interval` (minimum 20s), so metrics lag client actions. Compare desired \u2192 actual \u2192 Ready capacity. **App-observed** HTTP counters exclude probes/lifecycle and cannot see edge 502/504 or connection resets: inspect the web app client error/identity trace for those. Counters reset when pods restart; `rate()` handles resets. Zero, no traffic, missing samples, and failed scrapes are different states. The web app timeline/trace captures preStop, SIGTERM and response outcomes for replay."
          }
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "Accepted app requests / second",
          "description": "App counter, excluding probes/lifecycle/scrapes. Includes requests that later fail. Rate window is at least four 5s scrapes; this is not the offered client rate.",
          "datasource": {
            "type": "prometheus",
            "uid": "scaling-prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "sum by (labrun) (rate(scaling_lab_http_requests_total{job=\"scaling-app\",labrun=~\"$run\",labrun!=\"\"}[$__rate_interval]))",
              "legendFormat": "run {{labrun}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Scrape targets UP",
          "description": "Compare with pod Ready count. Missing series is no data, not a healthy zero.",
          "datasource": {
            "type": "prometheus",
            "uid": "scaling-prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "sum by (labrun) (up{job=\"scaling-app\",labrun=~\"$run\",labrun!=\"\"})",
              "legendFormat": "UP {{labrun}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Completed app responses by HTTP code",
          "description": "Completed responses emitted by Node.js. Edge 502/504 and incomplete/reset responses are tracked by the client trace, not by this counter.",
          "datasource": {
            "type": "prometheus",
            "uid": "scaling-prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "sum by (labrun,status) (rate(scaling_lab_http_responses_total{job=\"scaling-app\",labrun=~\"$run\",labrun!=\"\"}[$__rate_interval]))",
              "legendFormat": "HTTP {{status}} \u00b7 {{labrun}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "App HTTP error ratio: 4xx + 5xx / completed responses",
          "description": "Denominator: completed app responses in the same rate window. 3xx is not an error. With no completed traffic the ratio is undefined; no data does not prove no errors. Transport failures are separate.",
          "datasource": {
            "type": "prometheus",
            "uid": "scaling-prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "(sum by (labrun) (rate(scaling_lab_http_responses_total{job=\"scaling-app\",labrun=~\"$run\",labrun!=\"\",status_class=~\"4xx|5xx\"}[$__rate_interval])) or on(labrun) (0 * sum by (labrun) (rate(scaling_lab_http_responses_total{job=\"scaling-app\",labrun=~\"$run\",labrun!=\"\"}[$__rate_interval])))) / on(labrun) sum by (labrun) (rate(scaling_lab_http_responses_total{job=\"scaling-app\",labrun=~\"$run\",labrun!=\"\"}[$__rate_interval]))",
              "legendFormat": "{{labrun}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Response rate by status class",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "scaling-prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "sum by (labrun,status_class) (rate(scaling_lab_http_responses_total{job=\"scaling-app\",labrun=~\"$run\",labrun!=\"\"}[$__rate_interval]))",
              "legendFormat": "{{status_class}} \u00b7 {{labrun}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "App response latency p95",
          "description": "Histogram estimate of completed app response duration; incomplete responses and client/network waiting are not in this histogram.",
          "datasource": {
            "type": "prometheus",
            "uid": "scaling-prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le,labrun) (rate(scaling_lab_http_response_duration_seconds_bucket{job=\"scaling-app\",labrun=~\"$run\",labrun!=\"\"}[$__rate_interval])))",
              "legendFormat": "p95 {{labrun}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "In-flight learner requests",
          "description": "Excludes health probes, metrics scrapes, and lifecycle calls.",
          "datasource": {
            "type": "prometheus",
            "uid": "scaling-prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "sum by (labrun) (scaling_lab_http_inflight_requests{job=\"scaling-app\",labrun=~\"$run\",labrun!=\"\"})",
              "legendFormat": "{{labrun}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Open TCP sockets",
          "description": "Includes health/metrics sockets as well as learner connections. HTTP keep-alive sockets can remain open without in-flight requests.",
          "datasource": {
            "type": "prometheus",
            "uid": "scaling-prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "sum by (labrun) (scaling_lab_http_open_sockets{job=\"scaling-app\",labrun=~\"$run\",labrun!=\"\"})",
              "legendFormat": "{{labrun}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "HPA desired / current vs actual replicas",
          "description": "No HPA series is expected in connection/shutdown lessons. Desired capacity is not Ready capacity.",
          "datasource": {
            "type": "prometheus",
            "uid": "scaling-prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 36,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=~\"scaling-run-$run\"}",
              "legendFormat": "desired {{namespace}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=~\"scaling-run-$run\"}",
              "legendFormat": "HPA current {{namespace}}"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "kube_deployment_status_replicas{namespace=~\"scaling-run-$run\",deployment=\"app\"}",
              "legendFormat": "actual {{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Ready / unavailable app replicas",
          "description": "Observe how long desired/actual capacity takes to become Ready during slow startup or rollout.",
          "datasource": {
            "type": "prometheus",
            "uid": "scaling-prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 36,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "kube_deployment_status_replicas_ready{namespace=~\"scaling-run-$run\",deployment=\"app\"}",
              "legendFormat": "Ready {{namespace}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "kube_deployment_status_replicas_unavailable{namespace=~\"scaling-run-$run\",deployment=\"app\"}",
              "legendFormat": "unavailable {{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Pending / terminating app pods",
          "description": "Terminating pods can still be draining an active request. Follow preStop/SIGTERM/deadline in the learning trace.",
          "datasource": {
            "type": "prometheus",
            "uid": "scaling-prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 44,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "sum by (namespace) (kube_pod_status_phase{namespace=~\"scaling-run-$run\",pod=~\"app-.*\",phase=\"Pending\"})",
              "legendFormat": "Pending {{namespace}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "count by (namespace) (kube_pod_deletion_timestamp{namespace=~\"scaling-run-$run\",pod=~\"app-.*\"}) or on(namespace) (0 * count by(namespace) (kube_pod_info{namespace=~\"scaling-run-$run\",pod=~\"app-.*\"}))",
              "legendFormat": "terminating {{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Latest stored app sample age",
          "description": "Stored sample age, not query evaluation time. Rising age/failed UP can explain missing or stale data.",
          "datasource": {
            "type": "prometheus",
            "uid": "scaling-prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 44,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "time() - min by(labrun) (timestamp(scaling_lab_http_requests_total{job=\"scaling-app\",labrun=~\"$run\",labrun!=\"\"}))",
              "legendFormat": "{{labrun}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Completed app response counters by HTTP code",
          "description": "Counters of current pod processes; resets on restart. A first observed nonzero counter can be visible here before a rate can be calculated. The client trace remains authoritative for resets and edge errors.",
          "datasource": {
            "type": "prometheus",
            "uid": "scaling-prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 60,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "sum by (labrun,status) (scaling_lab_http_responses_total{job=\"scaling-app\",labrun=~\"$run\",labrun!=\"\"})",
              "legendFormat": "HTTP {{status}} \u00b7 {{labrun}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Shared CLI lab replicas (separate from dashboard runs)",
          "description": "Explicit legacy view. This panel is not filtered by the run variable.",
          "datasource": {
            "type": "prometheus",
            "uid": "scaling-prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 60,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "scaling-prometheus"
              },
              "expr": "kube_deployment_status_replicas_ready{namespace=\"scaling-lab\",deployment=\"app\"}",
              "legendFormat": "Ready shared CLI"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: scaling-lab
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: scaling-lab
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: scaling-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaling-grafana
  template:
    metadata:
      labels:
        app: scaling-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: scaling-lab
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/scaling-lab.json
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards/scaling-lab.json
              subPath: scaling-lab.json
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
